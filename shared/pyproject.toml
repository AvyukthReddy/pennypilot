[project]
name = "pennypilot-shared"
version = "0.1.0"
description = "Cross-service types shared between PennyPilot backend and worker"
requires-python = ">=3.12,<4.0"
dependencies = ["pydantic (>=2.9.0,<3.0.0)"]

[tool.poetry]
packages = [{ include = "shared" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
