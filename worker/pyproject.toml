[project]
name = "pennypilot-worker"
version = "0.1.0"
description = "PennyPilot Celery worker"
requires-python = ">=3.12,<4.0"
dependencies = [
    "celery[redis] (>=5.4.0,<6.0.0)",
]

[tool.poetry]
packages = [{ include = "worker" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
