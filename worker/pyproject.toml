[project]
name = "pennypilot-worker"
version = "0.1.0"
description = "PennyPilot Celery worker"
requires-python = ">=3.12,<4.0"
dependencies = [
    "celery[redis] (>=5.4.0,<6.0.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "pdfplumber (>=0.11.0,<1.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "openai (>=1.50.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "worker" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.3.0"
reportlab = "^4.2.0"  # test-fixture PDF generation only, not used at runtime

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
